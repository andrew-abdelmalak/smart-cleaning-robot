[project]
name = "smart-cleaning-robot"
version = "1.0.0"
description = "MicroPython firmware for a Raspberry Pi Pico W cleaning robot with BLE control and feed-forward plus PID motion control."
readme = "README.md"
license = "MIT"
authors = [{ name = "Andrew Abdelmalak" }]
# The firmware runs on MicroPython. This Python version applies only to the
# host-side tests and tooling.
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "mpy-cross>=1.29",
    "numpy>=2.5.3",
    "pytest>=9.1",
    "ruff>=0.16",
]
search = [
    "huggingface-hub>=1.33.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "tokenizers>=0.23.2",
]

[tool.uv]
package = false
# Resolve only releases at least two weeks old when the lock was made.
exclude-newer = "2026-10-05T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["firmware"]

[tool.ruff]
src = ["firmware", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM"]
