[project]
name = "smart-cleaning-robot"
version = "1.3.0"
description = "MicroPython firmware for a Raspberry Pi Pico W cleaning robot with BLE control and feed-forward plus PID motion control."
readme = "README.md"
license = "MIT"
authors = [{ name = "Andrew Abdelmalak" }]
# The firmware runs on MicroPython. This Python version applies only to the
# host-side tests and tooling.
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "mpy-cross>=1.29",
    "numpy>=2.5.3",
    "pytest>=9.1",
    "ruff>=0.16",
]
search = [
    "huggingface-hub>=1.33.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "tokenizers>=0.23.2",
]

[tool.uv]
package = false
# Resolve only releases at least two weeks old. Dependabot waits as long
# (.github/dependabot.yml), so its uv updates stay inside this window.
exclude-newer = "14 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["firmware", "scripts"]

[tool.ruff]
src = ["firmware", "tests"]
# Earlier firmware versions, kept as written (docs/history/README.md).
extend-exclude = ["docs/history"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM"]
