name: Pages

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "firmware/main.py"
      - "docs/media/**"
      - "docs/diagrams/**"
      - "docs/thesis/thesis.pdf"
      - "scripts/vendor.json"
      - "scripts/fetch_vendor.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The site runs the real firmware, so it ships the file the board runs,
      # plus the demo clips and diagrams that also appear in the README, and
      # the thesis PDF that the viewer below opens.
      - name: Assemble site
        run: |
          mkdir -p _site/firmware
          cp -r site/. _site/
          cp firmware/main.py _site/firmware/
          cp -r docs/media _site/media
          cp -r docs/diagrams _site/diagrams
          cp docs/thesis/thesis.pdf _site/

      # MicroPython WebAssembly, transformers.js, and the ONNX runtime, each
      # checked against the SHA-256 pinned in scripts/vendor.json.
      - name: Fetch pinned third-party files
        run: python3 scripts/fetch_vendor.py _site/vendor

      # Mozilla's prebuilt PDF viewer, pinned by version and checksum. The
      # thesis link and every search result open the thesis in it.
      - name: Add the PDF.js viewer
        env:
          PDFJS_VERSION: 6.4.299
          PDFJS_SHA256: f2245eb7ef3f674c872fe568a177bfec15874f5c034613e55d8e307f93ebd86d
        run: |
          curl -sSfL -o pdfjs.zip "https://github.com/mozilla/pdf.js/releases/download/v${PDFJS_VERSION}/pdfjs-${PDFJS_VERSION}-dist.zip"
          echo "${PDFJS_SHA256}  pdfjs.zip" | sha256sum -c
          unzip -q pdfjs.zip -d _site/pdfjs
          find _site/pdfjs -name '*.map' -delete
          rm _site/pdfjs/web/compressed.tracemonkey-pldi-09.pdf

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
