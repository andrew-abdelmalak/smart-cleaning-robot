name: Thesis

on:
  push:
    branches: ["main"]
    paths: ["docs/thesis/**", ".github/workflows/thesis.yml"]
  pull_request:
    branches: ["main"]
    paths: ["docs/thesis/**", ".github/workflows/thesis.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build thesis PDF (pdfLaTeX, TeX Live 2025)
    runs-on: ubuntu-latest
    container:
      # Same engine as the Overleaf project: pdfLaTeX on TeX Live 2025.
      image: texlive/texlive:TL2025-historic@sha256:7056390eac37715fd3e01875037ceb4016cb17d44c611f7bbbfa7a012007979f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build with latexmk
        working-directory: docs/thesis
        run: latexmk -pdf -no-shell-escape -interaction=nonstopmode -halt-on-error main.tex

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thesis-pdf
          path: docs/thesis/main.pdf
          if-no-files-found: error
