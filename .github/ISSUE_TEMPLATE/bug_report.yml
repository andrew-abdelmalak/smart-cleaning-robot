name: Bug report
description: Report firmware behavior that does not match the README.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security problems, do not use this form; follow SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The commands you sent, in order, or a failing test.
      placeholder: |
        1. Send CLEAN from a full stop
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Release or commit
      description: The release tag, or the commit SHA of firmware/main.py you flashed.
      placeholder: v1.1.0
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did you see it?
      options:
        - On the robot
        - In the host tests (uv run pytest)
        - Both
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Serial output or test failure
      description: Paste the MicroPython REPL output or the pytest failure.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
