<svg viewBox="0 0 1000 488" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="state-machine-dark-title state-machine-dark-desc">
<title id="state-machine-dark-title">Autonomous cleaning state machine</title>
<desc id="state-machine-dark-desc">State machine: from IDLE, CLEAN starts forward driving; an obstacle closer than 15 cm triggers a 39-pulse left pivot, and a wheel stall longer than 800 ms triggers reverse then the same pivot, both returning to forward driving.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs>
<rect width="100%" height="100%" fill="#2d3142"/>
<circle cx="16" cy="178" r="6" fill="#f5f5f5"/>
<path d="M22,178 H40" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M176,178 H240" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="188.5" y="158" width="39.0" height="12" rx="2" fill="#2d3142"/>
<text x="208.0" y="167" fill="#8e98ac" font-size="8" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">CLEAN</text>
<path d="M376,178 H440" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M576,178 H640" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="583.1" y="158" width="49.8" height="12" rx="2" fill="#2d3142"/>
<text x="608.0" y="167" fill="#8e98ac" font-size="8" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">&lt; 15 CM</text>
<path d="M776,178 H840" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M908,150 V98 Q908,90 900,90 H316 Q308,90 308,98 V150" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="577.7" y="70" width="60.6" height="12" rx="2" fill="#2d3142"/>
<text x="608.0" y="79" fill="#8e98ac" font-size="8" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">39 PULSES</text>
<path d="M508,206 V310 Q508,318 516,318 H640" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="539.6" y="298" width="76.8" height="12" rx="2" fill="#2d3142"/>
<text x="578.0" y="307" fill="#8e98ac" font-size="8" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">STALL 800 MS</text>
<path d="M708,346 V382 Q708,390 700,390 H316 Q308,390 308,382 V206" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="477.7" y="370" width="60.6" height="12" rx="2" fill="#2d3142"/>
<text x="508.0" y="379" fill="#8e98ac" font-size="8" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">39 PULSES</text>
<rect x="40" y="150" width="136" height="56" rx="8" fill="#2d3142"/>
<rect x="40" y="150" width="136" height="56" rx="8" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1"/>
<text x="108.0" y="180.0" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">IDLE</text>
<text x="108.0" y="195.0" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">motors off</text>
<rect x="240" y="150" width="136" height="56" rx="8" fill="#2d3142"/>
<rect x="240" y="150" width="136" height="56" rx="8" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1"/>
<text x="308.0" y="180.0" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">START_FWD</text>
<text x="308.0" y="195.0" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">reset straight PID</text>
<rect x="440" y="150" width="136" height="56" rx="8" fill="#2d3142"/>
<rect x="440" y="150" width="136" height="56" rx="8" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
<text x="508.0" y="180.0" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">FWD</text>
<text x="508.0" y="195.0" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">PID drive · 75 pps</text>
<rect x="640" y="150" width="136" height="56" rx="8" fill="#2d3142"/>
<rect x="640" y="150" width="136" height="56" rx="8" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1"/>
<text x="708.0" y="180.0" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">START_AVOID</text>
<text x="708.0" y="195.0" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">reset pivot PID</text>
<rect x="840" y="150" width="136" height="56" rx="8" fill="#2d3142"/>
<rect x="840" y="150" width="136" height="56" rx="8" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1"/>
<text x="908.0" y="180.0" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">AVOID</text>
<text x="908.0" y="195.0" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">pivot left</text>
<rect x="640" y="290" width="136" height="56" rx="8" fill="#2d3142"/>
<rect x="640" y="290" width="136" height="56" rx="8" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1"/>
<text x="708.0" y="320.0" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">STALL_TURN</text>
<text x="708.0" y="335.0" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">reverse 700 ms, pivot</text>
<text x="40" y="444" fill="#bfc0c0" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">Any state returns to IDLE on CLEAN, an emergency stop, or a BLE disconnect.</text>
<text x="40" y="466" fill="#bfc0c0" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">START_ states last one 20 ms tick: they record encoder counts and reset the PID.</text>
</svg>
