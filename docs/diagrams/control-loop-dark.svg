<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="control-loop-dark-title control-loop-dark-desc">
<title id="control-loop-dark-title">Feed-forward plus PID straight-line control</title>
<desc id="control-loop-dark-desc">Control loop: the target speed passes through a feed-forward motor model to set PWM, the wheel encoders measure the left-right pulse difference, and a PID adds a correction to the target speed of each wheel.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs>
<rect width="100%" height="100%" fill="#2d3142"/>
<path d="M190,112 H234" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M266,112 H310" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M510,112 H590" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="530.5" y="92" width="39.0" height="12" rx="2" fill="#2d3142"/>
<text x="550.0" y="101" fill="#8e98ac" font-size="8" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">PWM %</text>
<path d="M680,144 V240" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M590,272 H510" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="514.3" y="252" width="71.4" height="12" rx="2" fill="#2d3142"/>
<text x="550.0" y="261" fill="#8e98ac" font-size="8" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">L − R ERROR</text>
<path d="M310,272 H258 Q250,272 250,264 V128" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="186.8" y="194" width="55.2" height="12" rx="2" fill="#2d3142"/>
<text x="214.4" y="203" fill="#8e98ac" font-size="8" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">± ADJUST</text>
<rect x="40" y="80" width="150" height="64" rx="6" fill="#2d3142"/>
<rect x="40" y="80" width="150" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1"/>
<rect x="48" y="86" width="51.6" height="12" rx="2" fill="none" stroke="rgba(245,245,245,0.45)" stroke-width="0.8"/>
<text x="73.8" y="95" fill="rgba(245,245,245,0.45)" font-size="7" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">SETPOINT</text>
<text x="115.0" y="118.0" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Target speed</text>
<text x="115.0" y="133.0" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">75 pps, right × 0.75</text>
<circle cx="250" cy="112" r="16" fill="#393e53" stroke="#bfc0c0" stroke-width="1"/>
<text x="250" y="117" fill="#f5f5f5" font-size="14" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">+</text>
<rect x="310" y="80" width="200" height="64" rx="6" fill="#2d3142"/>
<rect x="310" y="80" width="200" height="64" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
<rect x="318" y="86" width="36.0" height="12" rx="2" fill="none" stroke="#f08a59" stroke-width="0.8"/>
<text x="336.0" y="95" fill="#f08a59" font-size="7" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
<text x="410.0" y="118.0" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Feed-forward model</text>
<text x="410.0" y="133.0" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">PWM = kS + kV × pps</text>
<rect x="590" y="80" width="180" height="64" rx="6" fill="#2d3142"/>
<rect x="590" y="80" width="180" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1"/>
<rect x="598" y="86" width="36.0" height="12" rx="2" fill="none" stroke="rgba(245,245,245,0.45)" stroke-width="0.8"/>
<text x="616.0" y="95" fill="rgba(245,245,245,0.45)" font-size="7" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">PLANT</text>
<text x="680.0" y="118.0" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">L298N + DC motors</text>
<text x="680.0" y="133.0" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">duty capped at 95 %</text>
<rect x="590" y="240" width="180" height="64" rx="6" fill="#2d3142"/>
<rect x="590" y="240" width="180" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1"/>
<rect x="598" y="246" width="41.2" height="12" rx="2" fill="none" stroke="rgba(245,245,245,0.45)" stroke-width="0.8"/>
<text x="618.6" y="255" fill="rgba(245,245,245,0.45)" font-size="7" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">SENSOR</text>
<text x="680.0" y="278.0" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Wheel encoders</text>
<text x="680.0" y="293.0" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">pulse count per wheel</text>
<rect x="310" y="240" width="200" height="64" rx="6" fill="#2d3142"/>
<rect x="310" y="240" width="200" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1"/>
<rect x="318" y="246" width="51.6" height="12" rx="2" fill="none" stroke="rgba(245,245,245,0.45)" stroke-width="0.8"/>
<text x="343.8" y="255" fill="rgba(245,245,245,0.45)" font-size="7" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">FEEDBACK</text>
<text x="410.0" y="278.0" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">PID correction</text>
<text x="410.0" y="293.0" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">P 0.8 · I 0.15 · D 0.25</text>
<text x="40" y="356" fill="#bfc0c0" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">Feed-forward supplies most of the drive; the PID only trims the left/right difference.</text>
<text x="40" y="378" fill="#bfc0c0" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">A pure PID drew enough current to cause brownouts that stalled a motor, so it became a correction term.</text>
</svg>
