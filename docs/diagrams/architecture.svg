<title id="architecture-title">Smart Cleaning Robot hardware architecture</title>
<desc id="architecture-desc">Block diagram: a phone, push button, ultrasonic sensor, and wheel encoders feed the Raspberry Pi Pico W, which drives the motors through an L298N H-bridge and switches the suction fan and status LED.</desc>
